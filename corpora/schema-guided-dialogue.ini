[corpus]
description = The complete original Schema-Guided Dialogue dataset of annotated multi-domain conversations between users and virtual assistants.
id = schema-guided-dialogue
title = Schema-Guided Dialogue

[source]
acquisition-basis = Dialogue JSON is retained directly from the publisher's immutable repository revision without transformation.
category = public-dataset
content-type = human conversations
content-type = task-oriented dialogue
content-type = virtual assistant dialogue
copyrighted = yes
language = en
license = CC-BY-SA-4.0
license-declaration = Google releases the SGD and SGD-X datasets under Creative Commons Attribution-ShareAlike 4.0; this selection contains only the original SGD dialogue records.
license-url = https://github.com/google-research-datasets/dstc8-schema-guided-dialogue/blob/e852981ae34990f4358979625854259302feaa78/LICENSE.txt
machine-generated = yes
name = Google Schema-Guided Dialogue Dataset
personal-data = unknown
selection = All original train, development, and test dialogue JSON files; schemas, SGD-X variants, images, documentation, and code are excluded.
url = https://github.com/google-research-datasets/dstc8-schema-guided-dialogue
version = e852981ae34990f4358979625854259302feaa78

[fetch]
estimated-size = 500M
fetcher = git
pathspec = :(glob)train/dialogues_*.json
pathspec = :(glob)dev/dialogues_*.json
pathspec = :(glob)test/dialogues_*.json
ref = e852981ae34990f4358979625854259302feaa78
revision = e852981ae34990f4358979625854259302feaa78
url = https://github.com/google-research-datasets/dstc8-schema-guided-dialogue.git

[input]
content = turns[].utterance
format = json
id = dialogue_id
nul = space
on-empty = skip
role = turns[].speaker
role-alias = USER=user
role-alias = SYSTEM=assistant
type = chat-messages
