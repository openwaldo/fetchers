[corpus]
description = The complete MultiDoGO collection of human-to-human task-oriented service conversations across six domains.
id = multidogo
title = MultiDoGO

[source]
acquisition-basis = All six unannotated conversation files are retained directly from the publisher's immutable repository revision without transformation.
category = public-dataset
content-type = human conversations
content-type = customer service dialogue
content-type = task-oriented dialogue
copyrighted = yes
language = en
license = CDLA-Permissive-1.0
license-declaration = The MultiDoGO repository licenses the dataset under the Community Data License Agreement Permissive Version 1.0.
license-url = https://github.com/awslabs/multi-domain-goal-oriented-dialogues-dataset/blob/baa30639c4b271f394b81443c842193407cdf26d/LICENSE.txt
machine-generated = no
name = Multi-Domain Goal-Oriented Dialogues
personal-data = unknown
selection = All publisher-provided unannotated human-to-human conversations from the airline, fast food, finance, insurance, media, and software domains; derived intent and slot-labeling paper splits are excluded.
url = https://github.com/awslabs/multi-domain-goal-oriented-dialogues-dataset
version = baa30639c4b271f394b81443c842193407cdf26d

[fetch]
estimated-size = 1G
fetcher = git
pathspec = :(glob)data/unannotated/*.tsv
ref = baa30639c4b271f394b81443c842193407cdf26d
revision = baa30639c4b271f394b81443c842193407cdf26d
url = https://github.com/awslabs/multi-domain-goal-oriented-dialogues-dataset.git

[input]
content = utterance
delimiter = comma
format = delimited
id = conversationId
nul = space
on-empty = skip
order = turnNumber
role = authorRole
role-alias = agent=assistant
role-alias = customer=user
type = delimited-chat
