[corpus]
description = The corrected MultiWOZ 2.2 collection of human-human written task-oriented conversations across multiple service domains.
id = multiwoz-2.2
title = MultiWOZ 2.2

[source]
acquisition-basis = All version 2.2 train, development, and test dialogue JSON files are retained directly from the publisher's immutable repository revision without transformation.
category = public-dataset
content-type = human conversations
content-type = task-oriented dialogue
content-type = wizard-of-oz dialogue
copyrighted = yes
language = en
license = MIT
license-declaration = The MultiWOZ repository releases the project under the MIT License and identifies MultiWOZ 2.2 as the corrected dataset release.
license-url = https://github.com/budzianowski/multiwoz/blob/fe0c8e65cfcd8462bd33c86e35f21addc84ca82b/LICENSE
machine-generated = no
name = MultiWOZ 2.2
personal-data = unknown
selection = All 10,437 corrected version 2.2 dialogues from the official train, development, and test JSON files; schemas, databases, model code, and older dataset releases are excluded.
url = https://github.com/budzianowski/multiwoz
version = fe0c8e65cfcd8462bd33c86e35f21addc84ca82b

[fetch]
estimated-size = 250M
fetcher = git
pathspec = :(glob)data/MultiWOZ_2.2/train/dialogues_*.json
pathspec = :(glob)data/MultiWOZ_2.2/dev/dialogues_*.json
pathspec = :(glob)data/MultiWOZ_2.2/test/dialogues_*.json
ref = fe0c8e65cfcd8462bd33c86e35f21addc84ca82b
revision = fe0c8e65cfcd8462bd33c86e35f21addc84ca82b
url = https://github.com/budzianowski/multiwoz.git

[input]
content = turns[].utterance
format = json
id = dialogue_id
meta = services=services[]
nul = space
on-empty = skip
role = turns[].speaker
role-alias = USER=user
role-alias = SYSTEM=assistant
type = chat-messages
