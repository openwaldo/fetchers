[corpus]
description = Public-domain books transcribed and proofread by Project Gutenberg volunteers.
id = gutenberg
title = Project Gutenberg

[source]
category = public-dataset
language = mul
license = CC0-1.0
license-declaration = CC0-1.0
license-url = https://www.gutenberg.org/
name = gutenberg
url = https://www.gutenberg.org/

[fetch]
estimated-size = 100G
exclude-ids = 673
fetcher = gutenberg
selection = all
url = https://www.gutenberg.org

[input]
format = text
end-pattern = (?m)^[ \t]*\*\*\*\s*END OF (?:THE|THIS) PROJECT GUTENBERG EBOOK[^\n]*$
on-empty = skip
start-pattern = (?m)^\*\*\*\s*START OF (?:THE|THIS) PROJECT GUTENBERG EBOOK[^\n]*$
type = bounded-text

