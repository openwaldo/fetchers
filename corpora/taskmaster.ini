[corpus]
description = The complete Taskmaster 1 through 4 collections of crowdworker-authored task-oriented conversations across everyday service domains.
id = taskmaster
title = Google Taskmaster Dialog Corpus

[source]
acquisition-basis = All dialogue JSON is retained directly from the publisher's revision-pinned repository without transformation.
category = public-dataset
content-type = human conversations
content-type = self-dialogues
content-type = spoken dialogue transcripts
content-type = task-oriented dialogue
copyrighted = yes
language = en
license = CC-BY-4.0
license-declaration = Each selected Taskmaster release declares Creative Commons Attribution 4.0 in its release README.
license-url = https://github.com/google-research-datasets/Taskmaster/tree/d92cb6af3005f1dc09c39e75e7daf4a04905e00b
machine-generated = no
name = Google Taskmaster
personal-data = unknown
selection = All 60,793 dialog records from the TM-1, TM-2, TM-3, and TM-4 data files; samples, ontologies, instructions, split lists, and reward examples are excluded.
url = https://github.com/google-research-datasets/Taskmaster
version = d92cb6af3005f1dc09c39e75e7daf4a04905e00b

[fetch]
estimated-size = 500M
fetcher = git
pathspec = TM-1-2019/self-dialogs.json
pathspec = TM-1-2019/woz-dialogs.json
pathspec = :(glob)TM-2-2020/data/*.json
pathspec = :(glob)TM-3-2020/data/*.json
pathspec = :(glob)TM-4-2024/data/*.json
ref = d92cb6af3005f1dc09c39e75e7daf4a04905e00b
revision = d92cb6af3005f1dc09c39e75e7daf4a04905e00b
url = https://github.com/google-research-datasets/Taskmaster.git

[input]
content = utterances[].text
format = json
id = conversation_id
nul = space
on-empty = skip
role = utterances[].speaker
type = chat-messages
